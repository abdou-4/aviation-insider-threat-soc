
title: Cargo Manifest Weight Anomaly – Off-Hours Edit by Unauthorised Role
id: c6a1d4b3-9e8f-4c2d-8a7b-0f1e3d5c7b9a
status: experimental
description: >
  Detects cargo manifest edits that reduce weight by more than 20 kg (simulated
  by near-zero weights on edit_manifest actions) or that occur during off-hours
  by a handler role without cargo-supervisor privileges.  Weight mismatches on
  cargo manifests can indicate theft, smuggling, or human trafficking cover-ups.
references:
  - https://attack.mitre.org/techniques/T1548/  (Abuse Elevation Control Mechanism)
  - https://attack.mitre.org/techniques/T1078/  (Valid Accounts)
  - Aviation Insider Threat Detection SOC – Cargo Handling Anomalies
author: SOC Detection Engineering Team
date: 2025-06-02
tags:
  - attack.t1078
  - attack.t1548
  - attack.t1565  (Data Manipulation)
logsource:
  category: application
  product: aviation_cargo_system
  service: cargo_api
detection:
  selection_edit:
    action: edit_manifest
  selection_suspicious_weight:
    # A manifest edit reducing weight below 5 kg is a strong signal that the
    # original weight was >20 kg higher and the manifest was altered without
    # a supervisor override.  Adjust threshold per operational baseline.
    - weight_kg|lte: 5
  selection_off_hours:
    hour_of_day:
      - 22
      - 23
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
  selection_unauthorised_role:
    # Only RampAgent and a designated CargoSupervisor should edit manifests.
    role:
      - BaggageHandler
      - Fueler
      - Caterer
  # Condition variants:
  #   A – Suspicious weight alone (high precision)
  #   B – Off-hours + unauthorised role (broader coverage)
  condition: selection_edit and (selection_suspicious_weight or (selection_off_hours and selection_unauthorised_role))
falsepositives:
  - Scale calibration error causing a false low weight reading.
  - Split-cargo operations where a single shipment is divided legitimately.
  - Supervisor override not logged due to system delay (rare).
level: medium
# ──────────────────────────────────────────────────────────────────────────────
# Correlation alternative (for SIEMs with sessionisation):
#   Correlate two cargo logs on the same cargo_id within 300 seconds:
#     - First event: action=scan or action=load, weight_kg=X
#     - Second event: action=edit_manifest, weight_kg=Y
#     - Condition: (X - Y) > 20
#   This precise correlation is not expressible in pure Sigma but can be
#   implemented as a Wazuh rule with `<field>.<prev>` context or via a Python
#   enrichment script.
# ──────────────────────────────────────────────────────────────────────────────
